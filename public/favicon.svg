<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGradient)" stroke="#f59e0b" stroke-width="2" />

  <!-- Subtle Inner Grid / Glow Accent -->
  <circle cx="48" cy="16" r="12" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />

  <!-- Brand Sparkle Symbol (✦) from Pratham.dev Navbar -->
  <path d="M 48 10 Q 48 16 54 16 Q 48 16 48 22 Q 48 16 42 16 Q 48 16 48 10 Z" fill="url(#goldGradient)" />

  <!-- Monogram Letter 'P' -->
  <text x="23" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle">P</text>

  <!-- Modern Tech Accent Dot (Cyan) -->
  <circle cx="43" cy="42" r="4.5" fill="url(#cyanGradient)" filter="url(#glow)" />
</svg>

